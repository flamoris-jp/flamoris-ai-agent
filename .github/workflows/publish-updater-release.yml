name: Publish repository-owned Updater release
on:
  pull_request:
    paths: ['.github/workflows/publish-updater-release.yml', 'release/**', 'scripts/*updater*.py', 'pyproject.toml', 'Dockerfile']
  push:
    branches: [main]
    paths: ['.github/workflows/publish-updater-release.yml', 'release/**', 'scripts/*updater*.py', 'pyproject.toml', 'Dockerfile']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-test-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build this repository's immutable Docker image
        run: |
          docker build --platform '${{ matrix.platform }}' --tag 'repository-release:1.0.2' .
          docker run --rm --entrypoint python 'repository-release:1.0.2' -c 'import importlib.metadata as m; assert m.version("flamoris-ai-agent") == "1.0.2"'
          docker run --rm --entrypoint python 'repository-release:1.0.2' -m pip check
          mkdir -p dist
          docker image save --output dist/image.tar 'repository-release:1.0.2'
          image_id=$(docker image inspect --format '{{.Id}}' 'repository-release:1.0.2')
          python scripts/package_updater_release.py --platform '${{ matrix.platform }}' --revision "$GITHUB_SHA" --image dist/image.tar --image-id "$image_id" --output dist/release
      - name: Install and start this release with the actual Updater
        run: |
          gateway=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          export FLAMORIS_INSTALL_TEST_POSTGRES_DSN="postgresql://postgres:disposable-test-password@${gateway}:5432/postgres"
          python -m pip install 'https://github.com/flamoris-jp/flamoris-updater/archive/83deb4d8687482d4c083ae8f0521c11ddd5eadfd.zip'
          sudo env GITHUB_ACTIONS=true FLAMORIS_INSTALL_TEST_POSTGRES_DSN="${FLAMORIS_INSTALL_TEST_POSTGRES_DSN:-}" "$(command -v python)" scripts/verify_updater_catalog.py dist/release/catalog-linux-${{ matrix.arch }}.json --install
      - uses: actions/upload-artifact@v4
        with:
          name: repository-release-${{ matrix.arch }}
          path: dist/release/
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: repository-release-*
          path: candidates/
      - run: python scripts/package_updater_release.py --combine candidates --output distribution
      - name: Publish this repository's immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api 'repos/'"$GITHUB_REPOSITORY"'/git/ref/tags/v1.0.2' > /dev/null 2>&1; then
            echo 'Release tag already exists; refusing to replace it'
            exit 1
          fi
          gh release create v1.0.2 distribution/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'flamoris-ai-agent v1.0.2' --notes-file release/NOTES.md --latest
