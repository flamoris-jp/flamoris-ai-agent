name: Publish repository-owned Updater release
on:
  pull_request:
    paths: ['.github/workflows/publish-updater-release.yml', 'release/**', 'scripts/*updater*.py', 'pyproject.toml', 'Dockerfile']
  push:
    branches: [main]
    paths: ['.github/workflows/publish-updater-release.yml', 'release/**', 'scripts/*updater*.py', 'pyproject.toml', 'Dockerfile']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build this repository's immutable Docker image
        run: |
          docker build --platform '${{ matrix.platform }}' --tag 'repository-release:1.0.1' .
          docker run --rm --entrypoint python 'repository-release:1.0.1' -c 'import importlib.metadata as m; assert m.version("flamoris-ai-agent") == "1.0.1"'
          docker run --rm --entrypoint python 'repository-release:1.0.1' -m pip check
          mkdir -p dist
          docker image save --output dist/image.tar 'repository-release:1.0.1'
          image_id=$(docker image inspect --format '{{.Id}}' 'repository-release:1.0.1')
          python scripts/package_updater_release.py --platform '${{ matrix.platform }}' --revision "$GITHUB_SHA" --image dist/image.tar --image-id "$image_id" --output dist/release
      - name: Validate with the actual Updater profile renderer
        run: |
          python -m pip install 'https://github.com/flamoris-jp/flamoris-updater/archive/96215ed53c7c7905ea7dcbcc42bb17d0f202e2ab.zip'
          python scripts/verify_updater_catalog.py dist/release/catalog-linux-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: repository-release-${{ matrix.arch }}
          path: dist/release/
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: repository-release-*
          path: candidates/
      - run: python scripts/package_updater_release.py --combine candidates --output distribution
      - name: Publish this repository's immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api 'repos/'"$GITHUB_REPOSITORY"'/git/ref/tags/v1.0.1' > /dev/null 2>&1; then
            echo 'Release tag already exists; refusing to replace it'
            exit 1
          fi
          gh release create v1.0.1 distribution/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'flamoris-ai-agent v1.0.1' --notes-file release/NOTES.md --latest
