name: Temporary source verification
on: pull_request
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_AGENT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check --fix .
        continue-on-error: true
      - run: ruff format .
      - name: Formatter patch
        run: python -c "import subprocess; print('CODEX_FORMAT_DIFF_BEGIN'); print(subprocess.check_output(['git','diff'],text=True)); print('CODEX_FORMAT_DIFF_END')"
      - run: ruff check .
        continue-on-error: true
      - run: pytest
