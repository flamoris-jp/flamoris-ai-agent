[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flamoris-ai-agent"
version = "1.0.0"
description = "Persistent FLAMORIS Agent runtime"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["flamoris-update-core[owner] @ https://github.com/flamoris-jp/flamoris-updater/archive/d9f010a92ff6e8a1e7a3b7fad8817850bdfb72cd.zip#subdirectory=packages/update-core", "httpx>=0.28,<1", "httpx2>=2.13,<3", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2", "mcp>=2.2,<3", "pydantic>=2.11,<3", "starlette>=1.7,<2", "uvicorn>=0.54,<1", "flamoris-intelligence-mcp @ https://github.com/flamoris-jp/flamoris-intelligence-mcp/archive/f94f8934c749a67bc1401f08103d16a93b1721e0.zip"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "build>=1.2,<2"]

[project.scripts]
flamoris-ai-agent-update-owner = "flamoris_ai_agent.updater:main"
flamoris-agent-register-targets = "flamoris_ai_agent.model_settings:main"
flamoris-agent-import-personality = "flamoris_ai_agent.personality:main"
flamoris-agent-chat = "flamoris_ai_agent.chat:main"
flamoris-agent-setup = "flamoris_ai_agent.setup:main"
flamoris-agent-register-runtime = "flamoris_ai_agent.register_runtime:main"
flamoris-agent-verify-db = "flamoris_ai_agent.verify_db:main"
flamoris-agent-mcp = "flamoris_ai_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flamoris_ai_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"agents" = "flamoris_ai_agent/agents"

[tool.hatch.build.targets.sdist]
include = ["src", "agents", "db", "tests", "docs", "history", "*.md", "LICENSE", "pyproject.toml", "requirements.txt", ".env.example", "Dockerfile", ".dockerignore", "compose.yaml", "docker-requirements.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["history"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
