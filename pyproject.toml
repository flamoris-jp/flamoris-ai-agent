[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flamoris-ai-agent"
version = "0.1.0"
description = "Persistent FLAMORIS Agent runtime"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2", "mcp>=2.2,<3", "pydantic>=2.11,<3", "starlette>=1.7,<2", "uvicorn>=0.54,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "build>=1.2,<2"]

[project.scripts]
flamoris-agent-chat = "flamoris_ai_agent.chat:main"
flamoris-agent-register-runtime = "flamoris_ai_agent.register_runtime:main"
flamoris-agent-verify-db = "flamoris_ai_agent.verify_db:main"
flamoris-agent-mcp = "flamoris_ai_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flamoris_ai_agent"]

[tool.hatch.build.targets.wheel.force-include]
"agents" = "flamoris_ai_agent/agents"

[tool.hatch.build.targets.sdist]
include = ["src", "agents", "db", "tests", "docs", "history", "*.md", "LICENSE", "pyproject.toml", "requirements.txt", ".env.example", "Dockerfile", ".dockerignore", "compose.yaml", "docker-requirements.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["history"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
